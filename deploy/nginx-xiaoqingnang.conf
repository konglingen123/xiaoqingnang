server {
    listen 80;
    listen [::]:80;
    server_name xiaoqingnang.cn www.xiaoqingnang.cn;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/xiaoqingnang.cn;
    }

    location / {
        return 301 https://xiaoqingnang.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xiaoqingnang.cn;

    ssl_certificate /www/server/panel/vhost/cert/xiaoqingnang.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xiaoqingnang.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaoQingNangSSL:10m;
    ssl_session_timeout 1d;

    root /www/wwwroot/xiaoqingnang.cn/web;
    index index.html;
    client_max_body_size 120m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/(\.runtime|\.git|database|docs|scripts)(/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        try_files $uri =404;
        expires 7d;
    }

    location ^~ /admin/ {
        root /www/wwwroot/xiaoqingnang.cn;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api|media)/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xiaoqingnang.cn;

    ssl_certificate /www/server/panel/vhost/cert/xiaoqingnang.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xiaoqingnang.cn/privkey.pem;
    return 301 https://xiaoqingnang.cn$request_uri;
}
